<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoneLine — Leads Dashboard</title>
<style>
  :root{
    --bg:#f4f7f8; --surface:#ffffff; --border:#d8e1e4; --ink:#101a21;
    --muted:#5b6b74; --accent:#1e8f9e; --warm:#c97a32; --good:#2e9563;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding:24px 20px 60px;
  }
  .wrap{ max-width:920px; margin:0 auto; display:flex; flex-direction:column; gap:20px; }
  h1{ font-size:1.4rem; margin:0; }
  .sub{ color:var(--muted); font-size:0.88rem; margin-top:4px; }
  table{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  th, td{ text-align:left; padding:10px 12px; font-size:0.86rem; border-bottom:1px solid var(--border); }
  th{ background:var(--bg); font-weight:600; color:var(--muted); text-transform:uppercase; font-size:0.7rem; letter-spacing:0.05em; }
  tr:last-child td{ border-bottom:none; }
  tr.row{ cursor:pointer; }
  tr.row:hover{ background:#f0f6f7; }
  .pill{ display:inline-block; padding:3px 9px; border-radius:999px; font-size:0.72rem; font-weight:600; }
  .pill.new{ background:#fdecdc; color:var(--warm); }
  .pill.contacted{ background:#e3f3f5; color:var(--accent); }
  .pill.booked{ background:#e4f5ec; color:var(--good); }
  .pill.closed{ background:#eceff1; color:var(--muted); }
  .source{ font-family:ui-monospace, monospace; font-size:0.72rem; color:var(--muted); }
  .empty{ padding:40px; text-align:center; color:var(--muted); background:var(--surface); border:1px dashed var(--border); border-radius:10px; }
  dialog{ border:none; border-radius:12px; padding:0; max-width:480px; width:92vw; }
  dialog .head{ padding:16px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  dialog .body{ padding:16px 18px; max-height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .msg{ padding:8px 12px; border-radius:10px; font-size:0.85rem; max-width:80%; }
  .msg.in{ background:#eceff1; align-self:flex-start; }
  .msg.out{ background:var(--accent); color:#fff; align-self:flex-end; }
  dialog .foot{ padding:14px 18px; border-top:1px solid var(--border); display:flex; gap:8px; }
  select, button.close{ font-size:0.85rem; padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); }
  button.close{ cursor:pointer; }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>Leads — BoneLine</h1>
      <div class="sub" id="client-label">Loading…</div>
    </div>
    <div id="content"></div>
  </div>

  <dialog id="convo-dialog">
    <div class="head">
      <strong id="convo-title">Conversation</strong>
      <button class="close" onclick="document.getElementById('convo-dialog').close()">Close</button>
    </div>
    <div class="body" id="convo-body"></div>
    <div class="foot">
      <select id="status-select">
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="booked">Booked</option>
        <option value="closed">Closed</option>
      </select>
    </div>
  </dialog>

<script>
  let currentLeadId = null;

  async function loadLeads(){
    const res = await fetch('/api/leads');
    const leads = await res.json();
    document.getElementById('client-label').textContent =
      leads.length + (leads.length === 1 ? ' lead' : ' leads') + ' captured';

    const content = document.getElementById('content');
    if (leads.length === 0){
      content.innerHTML = '<div class="empty">No leads yet — send a test WhatsApp message or missed-call event to see one appear here.</div>';
      return;
    }

    const rows = leads.map(l => `
      <tr class="row" onclick="openLead(${l.id}, '${l.contact}')">
        <td>${l.name || l.contact}</td>
        <td class="source">${l.source}</td>
        <td>${l.reason ? escapeHtml(l.reason).slice(0, 60) : '—'}</td>
        <td><span class="pill ${l.status}">${l.status}</span></td>
        <td>${new Date(l.created_at).toLocaleString()}</td>
      </tr>
    `).join('');

    content.innerHTML = `
      <table>
        <thead><tr><th>Contact</th><th>Source</th><th>Reason</th><th>Status</th><th>Created</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function openLead(id, contact){
    currentLeadId = id;
    const res = await fetch(`/api/leads/${id}/conversation`);
    const messages = await res.json();
    document.getElementById('convo-title').textContent = contact;
    document.getElementById('convo-body').innerHTML = messages.length
      ? messages.map(m => `<div class="msg ${m.direction}">${escapeHtml(m.body)}</div>`).join('')
      : '<div class="empty">No chat messages for this lead yet (likely a missed-call lead).</div>';
    document.getElementById('convo-dialog').showModal();
  }

  document.getElementById('status-select').addEventListener('change', async (e) => {
    if (!currentLeadId) return;
    await fetch(`/api/leads/${currentLeadId}/status`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: e.target.value }),
    });
    loadLeads();
  });

  loadLeads();
  setInterval(loadLeads, 5000);
</script>
</body>
</html>
